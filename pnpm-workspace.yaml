packages:
  - features/*/contracts
  - features/*/domain
  - features/*/ui
  - libs/*
  - apps/*
  - tools/*

# Default catalog - shared dependencies used across frontend and backend
catalog:
  # TypeScript & Build
  typescript: ^5.9.3
  tsup: ^8.5.1
  turbo: ^2.6.3
  tsx: ^4.21.0
  '@swc/cli': ^0.7.9
  '@swc/core': ^1.15.4

  # Testing
  vitest: ^4.0.15
  '@vitest/browser': ^4.0.15
  supertest: ^7.1.4
  '@types/supertest': ^6.0.3

  # Linting & Formatting
  eslint: ^9.39.2
  '@eslint/js': ^9.39.2
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^4.4.4
  eslint-plugin-import: ^2.32.0
  eslint-plugin-prettier: ^5.5.4
  prettier: ^3.7.4
  typescript-eslint: ^8.49.0

  # Schema/Validation
  zod: ^4.1.13
  class-transformer: ^0.5.1
  class-validator: ^0.14.3

  # Utilities
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  date-fns: ^4.1.0
  clsx: ^2.1.1
  change-case: ^5.4.4
  dotenv: ^17.2.3
  globals: ^16.5.0
  jsep: ^1.4.0
  glob: ^11.0.3
  cpy-cli: ^6.0.0

  # Node Types
  '@types/node': ^22.18.6

  # Release Tools
  '@changesets/cli': ^2.29.8
  conventional-changelog-cli: ^5.0.0
  npm-check-updates: ^19.2.0

  # Misc
  http-server: ^14.1.1

catalogs:
  # Frontend catalog - React, UI libraries, and frontend tooling
  frontend:
    # React Core
    react: ^19.2.3
    react-dom: ^19.2.3
    '@types/react': ^19.2.7
    '@types/react-dom': ^19.2.3

    # React Router
    react-router: ^7.10.1
    '@react-router/dev': ^7.10.1
    '@react-router/express': ^7.10.1
    '@react-router/node': ^7.10.1

    # Radix UI
    '@radix-ui/react-accordion': ^1.2.12
    '@radix-ui/react-alert-dialog': ^1.1.15
    '@radix-ui/react-aspect-ratio': ^1.1.8
    '@radix-ui/react-avatar': ^1.1.11
    '@radix-ui/react-checkbox': ^1.3.3
    '@radix-ui/react-collapsible': ^1.1.12
    '@radix-ui/react-context-menu': ^2.2.16
    '@radix-ui/react-dialog': ^1.1.15
    '@radix-ui/react-dropdown-menu': ^2.1.16
    '@radix-ui/react-hover-card': ^1.1.15
    '@radix-ui/react-label': ^2.1.8
    '@radix-ui/react-menubar': ^1.1.16
    '@radix-ui/react-navigation-menu': ^1.2.14
    '@radix-ui/react-popover': ^1.1.15
    '@radix-ui/react-progress': ^1.1.8
    '@radix-ui/react-radio-group': ^1.3.8
    '@radix-ui/react-scroll-area': ^1.2.10
    '@radix-ui/react-select': ^2.2.6
    '@radix-ui/react-separator': ^1.1.8
    '@radix-ui/react-slider': ^1.3.6
    '@radix-ui/react-slot': ^1.2.4
    '@radix-ui/react-switch': ^1.2.6
    '@radix-ui/react-tabs': ^1.1.13
    '@radix-ui/react-toast': ^1.2.15
    '@radix-ui/react-toggle': ^1.1.10
    '@radix-ui/react-toggle-group': ^1.1.11
    '@radix-ui/react-tooltip': ^1.2.8

    # UI Components
    lucide-react: ^0.561.0
    cmdk: ^1.1.1
    sonner: ^2.0.7
    vaul: ^1.1.2
    input-otp: ^1.4.2
    embla-carousel-react: ^8.6.0
    react-resizable-panels: ^3.0.6
    react-day-picker: ^9.12.0
    recharts: 3.5.1
    next-themes: ^0.4.6

    # Forms
    react-hook-form: ^7.68.0
    '@hookform/resolvers': ^5.2.2

    # Data Table
    '@tanstack/react-table': ^8.21.3

    # CSS/Styling
    tailwindcss: ^4.1.18
    '@tailwindcss/postcss': ^4.1.18
    '@tailwindcss/typography': ^0.5.19
    '@tailwindcss/vite': ^4.1.18
    tailwind-merge: ^3.4.0
    tw-animate-css: ^1.4.0
    tailwindcss-animate: ^1.0.7
    class-variance-authority: ^0.7.1
    autoprefixer: ^10.4.22
    postcss: ^8.5.6

    # Vite Build
    vite: ^7.2.7
    '@vitejs/plugin-react': ^5.1.2
    vite-tsconfig-paths: ^5.1.4
    vite-plugin-dts: ^4.5.4

    # Frontend Testing
    '@testing-library/react': ^16.3.0
    '@testing-library/jest-dom': ^6.9.1
    jsdom: ^27.3.0
    playwright: ^1.57.0

  # Backend catalog - NestJS, database, and server-side dependencies
  backend:
    # NestJS Core
    '@nestjs/common': ^11.1.9
    '@nestjs/core': ^11.1.9
    '@nestjs/platform-express': ^11.1.9
    '@nestjs/cli': ^11.0.14
    '@nestjs/schematics': ^11.0.9
    '@nestjs/testing': ^11.1.9

    # NestJS Features
    '@nestjs/jwt': ^11.0.2
    '@nestjs/passport': ^11.0.5
    '@nestjs/mongoose': ^11.0.4
    '@nestjs/throttler': ^6.5.0
    '@nestjs/serve-static': ^5.0.4

    # GraphQL
    '@nestjs/graphql': ^13.2.3
    '@nestjs/apollo': ^13.2.3
    '@apollo/server': ^4.12.0
    graphql: ^16.11.0
    graphql-subscriptions: ^3.0.0

    # Database
    mongoose: ^8.18.2
    mongodb-memory-server: ^10.2.1

    # Authentication
    passport: ^0.7.0
    passport-jwt: ^4.0.1
    passport-google-oauth20: ^2.0.0
    passport-github2: ^0.1.12
    bcrypt: ^6.0.0
    jsonwebtoken: ^9.0.2
    '@types/bcrypt': ^6.0.0
    '@types/passport-jwt': ^4.0.1
    '@types/passport-google-oauth20': ^2.0.16
    '@types/passport-github2': ^1.2.9
    '@types/jsonwebtoken': ^9.0.10

    # Express
    express: ^5.1.0
    '@types/express': ^5.0.3

    # Email
    nodemailer: ^7.0.6
    '@types/nodemailer': ^7.0.1

ignoredBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - core-js

onlyBuiltDependencies:
  - '@swc/core'
  - bcrypt
  - esbuild
  - mongodb-memory-server
  - protobufjs

overrides:
  '@conventional-changelog/git-client': ^2

shamefullyHoist: true
